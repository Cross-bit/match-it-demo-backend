name: Unit Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  ts-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - matching-sessions-service
          - friendship-service
          - user-account-service

    defaults:
      run:
        shell: bash
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      # Using npm install instead of npm ci to avoid CI breaks when package.json
      # changes are ahead of lockfile updates in active development.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test -- --runInBand

  recommender-python:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: services/activity-recommendation-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run recommender unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
