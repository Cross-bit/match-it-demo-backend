name: Unit Tests (TS Services)

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - matching-sessions-service
          - friendship-service
          - user-account-service

    defaults:
      run:
        shell: bash
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      # Using npm install instead of npm ci to avoid CI breaks when package.json
      # changes are ahead of lockfile updates in active development.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test -- --runInBand
