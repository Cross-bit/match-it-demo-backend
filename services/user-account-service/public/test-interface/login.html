<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="assets/style.css" rel="stylesheet" type="text/css" >
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    </head>
    <body>
        <div class="content card">
            <h3 class="text-center">User login</h3>
            <form id="credentials-form" action="/api/v1/credentials/create" method="post">
                <label for="email">Email</label><br>
                <input type="text" name="email"><br>
                <label for="password">Password</label><br>
                <input type="text" name="password"><br>
                <input type="submit">
            </form>
        </div>

        
        <script lang="javascript" >
            
            document.getElementById('credentials-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevents the default form submission

            // Get form data
            const formData = new FormData(event.target);
            const jsonObject = {};

            // Convert FormData to JSON object
            formData.forEach((value, key) => {
                jsonObject[key] = value;
            });

            console.log(JSON.stringify(jsonObject));
            // Send JSON data using fetch
            fetch('/api/v1/credentials/login', {
                method: 'POST',
                headers: {
                'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonObject)
            })
            .then(response => {
                response.text().then(msg => console.log(msg));
            })});

        </script>
    </body>
</html>
